server:
  port: ${SERVER_PORT:8080}

spring:
  profiles:
    default: cloud

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  ai:
    vectorstore:
      pgvector:
        table-name: ${PGVECTOR_TABLE_NAME:vector_store}
        dimensions: ${EMBEDDING_DIMENSIONS:1536}
        distance-type: COSINE_DISTANCE
        index-type: ${PGVECTOR_INDEX_TYPE:HNSW}
        initialize-schema: ${PGVECTOR_INITIALIZE_SCHEMA:true}

rag:
  auto-ingest: ${RAG_AUTO_INGEST:true}
  top-k: ${RAG_TOP_K:3}
  similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.65}

langfuse:
  public-key: ${LANGFUSE_PUBLIC_KEY:}
  secret-key: ${LANGFUSE_SECRET_KEY:}
  host: ${LANGFUSE_HOST:http://localhost:3000}

mcp:
  antigravity:
    enabled: ${MCP_ANTIGRAVITY_ENABLED:false}
    endpoint: ${MCP_ANTIGRAVITY_ENDPOINT:}
    token: ${MCP_ANTIGRAVITY_TOKEN:}
